<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUT-UP ENGINE — a time-war tactic</title>
<style>
  body { background:#1E2E24; color:#d8cfae; font-family: Georgia, serif; margin:0; padding:24px; }
  h1 { font-size:1.4em; letter-spacing:.12em; color:#B08D3E; margin-bottom:4px; }
  .sub { color:#8a9a7b; font-style:italic; margin-bottom:16px; max-width:760px; }
  label { display:block; margin:14px 0 6px; font-size:.85em; letter-spacing:.15em; color:#B08D3E; }
  textarea { width:100%; max-width:760px; background:#141b12; color:#d8cfae; border:1px solid #3a4a33; font-family:Georgia, serif; font-size:1em; padding:10px; box-sizing:border-box; }
  #out { max-width:728px; border:1px solid #3a4a33; background:#141b12; padding:16px; line-height:1.7; min-height:120px; white-space:pre-wrap; }
  button { background:#B08D3E; color:#1E2E24; border:none; padding:10px 18px; font-family:inherit; font-size:1em; cursor:pointer; margin:12px 8px 0 0; }
  button:hover { background:#c9a44f; }
  input[type=range] { width:200px; vertical-align:middle; }
</style>
</head>
<body>
<h1>CUT-UP ENGINE</h1>
<div class="sub">Burroughs said the cut-up breaks the prerecorded universe. This is a small machine for breaking it. Feed it text, set the blade width, cut.</div>

<label>SOURCE TEXT</label>
<textarea id="src" rows="8">The troop has no leader, only mothers. The forest has no center, only signal. A lemur reads the air the way you read a feed, except the air does not lie about what it wants. Time here is not a line but a thicket. Every path through the thicket is taken by something with teeth. The mainlanders brought clocks and then wondered why nothing obeyed them. We obey the mothers, the fruiting season, and the smell of rain two valleys over. Everything else is a rumor the future started about itself.</textarea>

<label>SECOND TEXT (for fold-in)</label>
<textarea id="src2" rows="5">FIELD MANUAL, PAGE 9: When the signal degrades, do not increase the volume. Increase the number of ears. A message repeated often enough becomes weather. The Rift does not transmit; it remembers forward. If you find a footprint facing both directions, follow the one that is not yours.</textarea>

<label>BLADE WIDTH (words per chunk): <span id="csVal">5</span></label>
<input type="range" id="chunk" min="1" max="12" value="5">

<div>
  <button id="cutBtn">CUT</button>
  <button id="foldBtn">FOLD-IN</button>
</div>

<label>OUTPUT</label>
<div id="out">Nothing cut yet. The timeline remains prerecorded.</div>

<script>
function wordsOf(id) {
  return document.getElementById(id).value.split(/\s+/).filter(function(w) { return w.length > 0; });
}
function chunkUp(words, n) {
  var out = [];
  for (var i = 0; i < words.length; i += n) out.push(words.slice(i, i + n).join(' '));
  return out;
}
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function blade() { return parseInt(document.getElementById('chunk').value, 10); }

document.getElementById('chunk').oninput = function() {
  document.getElementById('csVal').textContent = this.value;
};
document.getElementById('cutBtn').onclick = function() {
  var c = shuffle(chunkUp(wordsOf('src'), blade()));
  document.getElementById('out').textContent = c.join(' ');
};
document.getElementById('foldBtn').onclick = function() {
  var a = chunkUp(wordsOf('src'), blade());
  var b = chunkUp(wordsOf('src2'), blade());
  var out = [];
  var m = Math.max(a.length, b.length);
  for (var i = 0; i < m; i++) {
    if (a[i]) out.push(a[i]);
    if (b[i]) out.push(b[i]);
  }
  document.getElementById('out').textContent = shuffle(out).join(' ');
};
</script>
</body>
</html>
